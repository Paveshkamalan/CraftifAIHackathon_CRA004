project:
  name: "AdaPipe"
  version: "1.0.0"
  track: "CraftifAI_Physical_AI_Hackathon_Track_A"

use_case:
  name: "door_person_count"
  description: "Count people entering and exiting a monitored doorway."
  input_video: "demo/sample_video.mp4"
  high_load_video: "demo/high_load_video.mp4"

slo:
  min_fps: 20
  max_p95_latency_ms: 200
  min_detection_confidence: 0.50

benchmark:
  duration_seconds: 30
  warmup_seconds: 3
  metric_window_seconds: 3

runtime_policy:
  degrade_after_violations: 3
  recover_after_success_windows: 5
  recovery_latency_ratio: 0.7
  quality_drop_revert_threshold: 0.20

output:
  benchmark_csv: "results/benchmark_results.csv"
  selection_json: "results/selection_report.json"
  adaptation_log: "results/adaptation_log.jsonl"
  report_md: "results/selection_report.md"
